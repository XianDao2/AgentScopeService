version: '3.8'

services:
  ms3-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ms3:2.0.0
    container_name: ms3-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      mongodb:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - ./data/workspaces:/data/workspaces
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 9G
        reservations:
          cpus: '2'
          memory: 4G
    networks:
      - ms3-network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: ms3-mysql
    ports:
      - "23306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ruoyi-ai-agent
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./src/ms3/database/migrations:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1.5G
    networks:
      - ms3-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ms3-redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1.5G
    networks:
      - ms3-network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.8.2
    container_name: ms3-qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    networks:
      - ms3-network
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: ms3-mongodb
    ports:
      - "8010:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - ./data/mongodb:/data/db
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 0.5G
    networks:
      - ms3-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: ms3-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 0.5G
    networks:
      - ms3-network
    restart: unless-stopped

networks:
  ms3-network:
    driver: bridge
