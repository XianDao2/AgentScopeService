services:
  ms3-api:
    image: ms3:1.0
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - mysql
      - redis
      - qdrant
      - mongodb
      - minio
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 9G
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    ports:
      - "23306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ruoyi-ai-agent
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/ms3/database/migrations/V1__initial_schema.sql:/docker-entrypoint-initdb.d/01_init.sql
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1.5G
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:6.2
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1.5G
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    ports:
      - "8010:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - mongo_data:/data/db
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 0.5G
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 0.5G
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  qdrant_data:
  mongo_data:
  minio_data:
