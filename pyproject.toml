[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ms3"
version = "0.1.0"
description = "AgentScope v2 multi-tenant agent platform"
requires-python = ">=3.11"
dependencies = [
    "agentscope[full]>=2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0",
    "aioredis>=2.0",
    "pymongo>=4.0",
    "motor>=3.0",
    "qdrant-client>=1.0",
    "minio>=7.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.6",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ms3"]

[tool.ruff]
line-length = 120
target-version = "py311"
